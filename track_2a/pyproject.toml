[project]
name = "booklet-nli"
version = "0.1.0"
description = "Multilingual claim verification over Swiss federal voting booklets with Apertus"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.5",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.40",
    "pymupdf>=1.24",
]

[project.scripts]
booklet-nli = "booklet_nli.cli:main"
booklet-nli-cases = "booklet_nli.cases:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
modal = ["modal>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booklet_nli"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
